name: seat-reservation-demo

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: seat_reservation
      POSTGRES_USER: seat_app
      POSTGRES_PASSWORD: localpass
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local,demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/seat_reservation
      SPRING_DATASOURCE_USERNAME: seat_app
      SPRING_DATASOURCE_PASSWORD: localpass
      APP_DEMO_USER_ID: ${DEMO_USER_ID:-demo-user-1}
      APP_DEMO_ROLE: ${DEMO_ROLE:-USER}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  frontend:
    build: ./frontend
    environment:
      API_TARGET: http://backend:8080
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
      VITE_DEMO_AUTH: "true"
      VITE_DEMO_USER_ID: ${DEMO_USER_ID:-demo-user-1}
      VITE_DEMO_ROLE: ${DEMO_ROLE:-USER}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
    # Composeプロジェクト専用ボリューム。Cognito用DBとは共有しない。
    driver: local
