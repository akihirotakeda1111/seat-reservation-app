services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: seat_reservation
      POSTGRES_USER: seat_app
      POSTGRES_PASSWORD: localpass
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/seat_reservation
      SPRING_DATASOURCE_USERNAME: seat_app
      SPRING_DATASOURCE_PASSWORD: localpass
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI:?Set COGNITO_ISSUER_URI}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?Set COGNITO_CLIENT_ID}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  frontend:
    build: ./frontend
    environment:
      API_TARGET: http://backend:8080
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
      VITE_COGNITO_AUTHORITY: ${COGNITO_ISSUER_URI}
      VITE_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      VITE_COGNITO_DOMAIN: ${VITE_COGNITO_DOMAIN:?Set VITE_COGNITO_DOMAIN}
      VITE_AUTH_REDIRECT_URI: ${VITE_AUTH_REDIRECT_URI:-http://localhost:5173/auth/callback}
      VITE_AUTH_LOGOUT_URI: ${VITE_AUTH_LOGOUT_URI:-http://localhost:5173/login}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-backend_postgres_data}
