name: Prepare backend release

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 25
    env:
      AWS_REGION: ap-northeast-1
      ROLE_ARN: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
      REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate configuration
        shell: bash
        run: |
          [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]] || { echo 'Set AWS_ECR_PUSH_ROLE_ARN'; exit 1; }
          [[ "$REPOSITORY_URL" =~ ^[0-9]{12}\.dkr\.ecr\.ap-northeast-1\.amazonaws\.com/[a-z0-9][a-z0-9._/-]*$ ]] || { echo 'Set ECR_REPOSITORY_URL'; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}
      - name: Build and push image
        shell: bash
        run: |
          registry="${REPOSITORY_URL%%/*}"
          repository="${REPOSITORY_URL#*/}"
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          trap 'docker logout "$registry"' EXIT
          docker build --pull --platform linux/amd64 --tag "$REPOSITORY_URL:$tag" backend
          docker push "$REPOSITORY_URL:$tag"
          digest="$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid image digest'; exit 1; }
          mkdir -p release
          jq -n --arg commit "$GITHUB_SHA" --arg tag "$tag" --arg image "$REPOSITORY_URL@$digest" --arg digest "$digest" \
            '{commit: $commit, tag: $tag, image_uri: $image, image_digest: $digest}' > release/backend.json
          {
            echo '### Backend release (not deployed)'
            printf 'Commit: `%s`\n\nImage: `%s@%s`\n\n' "$GITHUB_SHA" "$REPOSITORY_URL" "$digest"
            echo 'Run Deploy release with this CI run ID. CD registers the image and starts one task for both initial and subsequent releases; no per-release Terraform apply is required.'
            echo '```hcl'
            cat release/backend.json
            echo '```'
            echo 'Keep rollback_enabled = false for the first deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 30
