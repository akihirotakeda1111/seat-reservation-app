name: Prepare frontend release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 10
    env:
      VITE_COGNITO_AUTHORITY: ${{ vars.VITE_COGNITO_AUTHORITY }}
      VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
      VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
      VITE_AUTH_REDIRECT_URI: ${{ vars.VITE_AUTH_REDIRECT_URI }}
      VITE_AUTH_LOGOUT_URI: ${{ vars.VITE_AUTH_LOGOUT_URI }}
      VITE_DEMO_AUTH: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate public configuration
        run: node .github/scripts/validate-frontend-env.mjs
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Package release
        shell: bash
        run: |
          mkdir -p release
          tar -czf release/frontend.tar.gz -C frontend/dist .
          jq -n --arg commit "$GITHUB_SHA" --arg redirect "$VITE_AUTH_REDIRECT_URI" \
            '{commit: $commit, redirect_uri: $redirect}' > release/frontend.json
          (cd release && sha256sum frontend.tar.gz > SHA256SUMS)
          {
            echo '### Frontend release (not deployed)'
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            echo 'Download the frontend-release artifact, verify SHA256SUMS, and deploy frontend.tar.gz manually. Do not rebuild locally.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 30
