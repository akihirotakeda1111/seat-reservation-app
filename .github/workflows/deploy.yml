name: Deploy release

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful main CI run ID containing both release artifacts
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 45
    env:
      AWS_REGION: ap-northeast-1
      AWS_PAGER: ""
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      DEPLOYMENT_PARAMETER_NAME: ${{ vars.DEPLOYMENT_PARAMETER_NAME }}
    steps:
      - uses: actions/checkout@v6
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.13"
      - name: Download and verify release provenance
        id: download
        run: python .github/scripts/deploy.py download
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        id: auth
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy backend and frontend
        id: deploy
        run: python .github/scripts/deploy.py deploy
      - name: Finalize deployment record
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          SETUP_OUTCOME: ${{ steps.python.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: python3 .github/scripts/deploy.py finalize
      - name: Save deployment record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-record.json
          retention-days: 30
